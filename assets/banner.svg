<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.5" opacity="0.3" />
    </pattern>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
    
    /* Subtle Dynamic CSS Animations */
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -40; }
    }
    @keyframes nodePulse {
      0% { r: 4px; opacity: 0.6; }
      50% { r: 7px; opacity: 1; }
      100% { r: 4px; opacity: 0.6; }
    }

    .pulsing-bg { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .animated-line { stroke-dasharray: 8 8; animation: dashMove 2s linear infinite; }
    .pulsing-node { animation: nodePulse 3s ease-in-out infinite; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="12" />
  <rect width="1200" height="360" fill="url(#grid)" rx="12" />

  <!-- Background Dynamic Decorative Graphics (Strictly behind text) -->
  <g class="pulsing-bg" opacity="0.4">
    <circle cx="1050" cy="180" r="180" fill="#38bdf8" filter="url(#glow)" opacity="0.15" />
    <circle cx="150" cy="90" r="120" fill="#818cf8" filter="url(#glow)" opacity="0.1" />
  </g>

  <!-- Technical Line Art & Network Graphic (Right Side) -->
  <g opacity="0.7">
    <!-- Factory & Industrial Digital Waves -->
    <path d="M 750 260 L 850 200 L 950 230 L 1050 150 L 1150 180" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-line" />
    <path d="M 750 290 L 870 230 L 930 250 L 1020 180 L 1150 210" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.6" />
    
    <!-- Nodes -->
    <circle cx="850" cy="200" r="5" fill="#38bdf8" class="pulsing-node" />
    <circle cx="950" cy="230" r="5" fill="#818cf8" class="pulsing-node" style="animation-delay: 1s;" />
    <circle cx="1050" cy="150" r="6" fill="#c084fc" class="pulsing-node" style="animation-delay: 1.5s;" />
    <circle cx="1150" cy="180" r="4" fill="#38bdf8" />
  </g>

  <!-- Foreground Content Block -->
  <g transform="translate(70, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 75)">
      <rect width="260" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9"/>
      <text x="130" y="21" text-anchor="middle" class="badge-text">⚡ INDUSTRY 4.0 &amp; SMART FACTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="165" class="title">Manufacturing Execution System</text>
    <text x="0" y="215" class="title" fill="url(#accentGrad)">(MES) Ecosystem 🏭</text>

    <!-- Subtitle -->
    <text x="0" y="265" class="subtitle">A Curated List of SaaS Platforms &amp; Open-Source Projects</text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="295" width="480" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
